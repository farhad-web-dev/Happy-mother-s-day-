<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Mother's Day</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            width: 85%;
            max-width: 400px;
            z-index: 10;
        }
        .heart { font-size: 60px; animation: beat 0.8s infinite alternate; display: inline-block; }
        @keyframes beat { from { transform: scale(1); } to { transform: scale(1.15); } }
        
        .btn {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: 0.3s;
        }
        .btn:active { transform: scale(0.95); }

        #message-box { 
            display: none; 
            margin-top: 20px; 
            padding: 15px;
            background: #fff0f3;
            border-radius: 15px;
            color: #c9184a;
            border: 2px dashed #ff4d6d;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="heart">❤️</div>
    <h1>Happy Mother's Day!</h1>
    <p>Aap duniya ki sabse pyari Maa hain.</p>
    
    <button class="btn" onclick="celebrate()">Click for Surprise</button>

    <div id="message-box">
        <p>"Maa, mere liye sab kuch karne ke liye shukriya. I love you so much!"</p>
        <p><strong>- Made by your son</strong></p>
    </div>
</div>

<audio id="maaSong" preload="auto">
    <source src="maa.mp3" type="audio/mpeg">
</audio>

<script>
    function celebrate() {
        const box = document.getElementById("message-box");
        const music = document.getElementById("maaSong");

        // 1. Force Sound Play
        music.volume = 1.0; // Ensure volume is up
        music.currentTime = 0; // Restart if clicked again
        
        // Browser compatibility ke liye promise handling
        let playPromise = music.play();
        if (playPromise !== undefined) {
            playPromise.then(_ => {
                console.log("Audio playing!");
            }).catch(error => {
                console.log("Audio blocked: ", error);
            });
        }

        // 2. Boom Effect (Confetti)
        confetti({
            particleCount: 200,
            spread: 100,
            origin: { y: 0.6 }
        });

        // 3. Show Message
        box.style.display = "block";
    }
</script>

</body>
</html>
